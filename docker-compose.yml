services:
  mongodb:
    image: mongo:6.0
    container_name: hosteliq-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hosteliq-backend
    restart: always
    command: sh -c "node utils/seeder.js && node server.js"
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/hosteliq
      - JWT_SECRET=supersecretjwtkeyforhosteliqtokenauth
      - NODE_ENV=production
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hosteliq-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
    driver: local
